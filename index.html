const dist = (a, b) => Math.sqrt((b.x - a.x) ** 2 + (b.y - a.y) ** 2);

/* ══ ALGEBRA LINEARE ════════════════════════════════════════════════ */
const zeros = (m, n) => Array.from({ length: m }, () => new Array(n).fill(0));

/* ══ TRILATERAZIONE ════════════════════════════════════════════════ */
function trilat(p1, d1, p2, d2, hint) {

function computeTrilat(pts, segs) {

/* ══ MINIMI QUADRATI ════════════════════════════════════════════════ */

      const c1 = X[s.p1], c2 = X[s.p2]; if (!c1 || !c2) { row++; return; }

      if (i2 != null) { A[row][i2] = dx / d; A[row][i2 + 1] = dy / d; }
      row++;
    });

      const cv = X[a.vertex], c1 = X[a.p1], c2 = X[a.p2]; if (!cv || !c1 || !c2) { row++; return; }
      const dx1 = c1.x - cv.x, dy1 = c1.y - cv.y, r1sq = dx1 * dx1 + dy1 * dy1;
      const dx2 = c2.x - cv.x, dy2 = c2.y - cv.y, r2sq = dx2 * dx2 + dy2 * dy2;

      while (ang > Math.PI) ang -= 2 * Math.PI; while (ang < -Math.PI) ang += 2 * Math.PI;

/* ══ DXF ════════════════════════════════════════════════════════════ */
function makeDXF(pts, segs, W) {

  pts.forEach(p => { const w = W[p.id]; if (!w) return; s += `0\nPOINT\n8\nPUNTI\n10\n${w.x.toFixed(4)}\n20\n${w.y.toFixed(4)}\n30\n0.0000\n`; s += `0\nTEXT\n8\nETICHETTE\n10\n${(w.x + .05).toFixed(4)}\n20\n${(w.y + .05).toFixed(4)}\n30\n0.0000\n40\n0.15\n1\n${p.label}\n`; });
  segs.forEach(sg => { const w1 = W[sg.p1], w2 = W[sg.p2]; if (!w1 || !w2) return; s += `0\nLINE\n8\nRILIEVO\n10\n${w1.x.toFixed(4)}\n20\n${w1.y.toFixed(4)}\n30\n0.0000\n11\n${w2.x.toFixed(4)}\n21\n${w2.y.toFixed(4)}\n31\n0.0000\n`; });

function dl(content, name, type = 'text/plain') { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([content], { type })); a.download = name; a.click(); }

/* ══ COMPONENTE PRINCIPALE ══════════════════════════════════════════ */
function Rilievo() {
  const svgRef = useRef();
  /* ── Refs per handler nativi (no stale closure) ── */
  const vbRef    = useRef({ x: 0, y: 0, w: 900, h: 640 });
  const modeRef  = useRef('point');
  const touchRef = useRef({ pinchDist: null, panActive: false, panStart: null });

  /* ── State ── */
  const [pts,     setPts]     = useState([]);
  const [segs,    setSegs]    = useState([]);
  const [angles,  setAngles]  = useState([]);
  const [mode,    setMode]    = useState('point');
  const [sel1,    setSel1]    = useState(null);
  const [angSel,  setAngSel]  = useState([]);
  const [vb,      setVb]      = useState({ x: 0, y: 0, w: 900, h: 640 });
  const [pan,     setPan]     = useState(false);
  const [panStart,setPanStart]= useState(null);
  const [adjusted,setAdjusted]= useState(false);
  const [editSeg, setEditSeg] = useState(null);
  const [editVal, setEditVal] = useState('');
  const [editAngle,setEditAngle] = useState(null);
  const [editAngVal,setEditAngVal] = useState('');
  const [tab,     setTab]     = useState('segs');
  const [hov,     setHov]     = useState(null);
  const [drawer,  setDrawer]  = useState(false);   // ← drawer aperto/chiuso

  /* Aggiorna refs */
  vbRef.current   = vb;
  modeRef.current = mode;

  /* ── Persistenza ── */
  useEffect(() => { try { const d = JSON.parse(localStorage.getItem('rilievo_v3') || 'null'); if (d?.pts) setPts(d.pts); if (d?.segs) setSegs(d.segs); if (d?.angles) setAngles(d.angles); } catch (_) { } }, []);
  useEffect(() => { try { localStorage.setItem('rilievo_v3', JSON.stringify({ pts, segs, angles })); } catch (_) { } }, [pts, segs, angles]);

  /* ── Calcolo coordinate ── */
  const result  = useMemo(() => computeWorldFull(pts, segs, angles), [pts, segs, angles]);
  const { world, sigma, sigma0, redundancy, residuals } = result;

  /* ── Vista corretta ── */
  const adjPos = useMemo(() => {
    if (!adjusted) return null;
    const wp = pts.filter(p => world[p.id]); if (wp.length < 2) return null;
    const xs = wp.map(p => world[p.id].x), ys = wp.map(p => world[p.id].y);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const mg = 80, cw = vb.w - 2 * mg, ch = vb.h - 2 * mg;
    const sc2 = Math.min(cw / Math.max(x1 - x0, .01), ch / Math.max(y1 - y0, .01));
    return Object.fromEntries(wp.map(p => [p.id, { x: vb.x + mg + (world[p.id].x - x0) * sc2, y: vb.y + mg + ch - (world[p.id].y - y0) * sc2 }]));
  }, [adjusted, world, pts, vb]);

  const segInfo = s => {
    if (!s.dist || s.dist <= 0) return { status: 'unmeasured', calc: null, delta: null };
    const w1 = world[s.p1], w2 = world[s.p2]; if (!w1 || !w2) return { status: 'measured', calc: null, delta: null };

    const el = svgRef.current; if (!el) return;

  };

    if (!pts.length) { setVb({ x: 0, y: 0, w: 900, h: 640 }); return; }
    const el = svgRef.current; if (!el) return;
    const r = el.getBoundingClientRect();
    const allX = pts.map(p => gp(p).x), allY = pts.map(p => gp(p).y);
    const x0 = Math.min(...allX), x1 = Math.max(...allX), y0 = Math.min(...allY), y1 = Math.max(...allY);

    if (pan) return;

      const idx = pts.length, label = ALPHA[idx % 26] + (idx >= 26 ? Math.floor(idx / 26) : '');

    } else if (mode === 'segment') {
      const hit = hitPt(pos); if (!hit) return;

      setSel1(null);
    } else if (mode === 'angle') {
      const hit = hitPt(pos); if (!hit) return;
      if (angSel.length === 0) { setAngSel([hit.id]); return; }
      if (angSel.length === 1) { if (hit.id !== angSel[0]) setAngSel([angSel[0], hit.id]); return; }

    }
  };

    if (mode === 'pan' || e.button === 1) {
      setPan(true); setPanStart({ x: e.clientX, y: e.clientY, vb: { ...vb } });
    }
  };
  const onMM = e => {
    if (!pan || !panStart) return;
    const r = svgRef.current?.getBoundingClientRect(); if (!r) return;
    setVb(v => ({ ...v, x: panStart.vb.x - (e.clientX - panStart.x) * panStart.vb.w / r.width, y: panStart.vb.y - (e.clientY - panStart.y) * panStart.vb.h / r.height }));
  };

    if (e.touches.length === 2) {

      touchRef.current.panActive = false; setPan(false);
    } else if (e.touches.length === 1 && modeRef.current === 'pan') {
      touchRef.current.panActive = true;
      touchRef.current.panStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, vb: { ...vbRef.current } };
      setPan(true);
    }
  };

  useEffect(() => {
    const el = svgRef.current; if (!el) return;
    const onWheel = e => {
      e.preventDefault(); const v = vbRef.current, f = e.deltaY > 0 ? 1.13 : 0.88;

      setVb({ x: pos.x - (pos.x - v.x) * f, y: pos.y - (pos.y - v.y) * f, w: v.w * f, h: v.h * f });
    };
    const onTM = e => {
      const ts = touchRef.current;
      if (e.touches.length === 2) {
        e.preventDefault();
        const nd = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        if (ts.pinchDist > 0) {
          const f = ts.pinchDist / nd, r = el.getBoundingClientRect();
          const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2, cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
          setVb(v => { const pos = { x: v.x + (cx - r.left) * v.w / r.width, y: v.y + (cy - r.top) * v.h / r.height }; return { x: pos.x - (pos.x - v.x) * f, y: pos.y - (pos.y - v.y) * f, w: v.w * f, h: v.h * f }; });
        }
        ts.pinchDist = nd;
      } else if (e.touches.length === 1 && ts.panActive && ts.panStart) {
        e.preventDefault();
        const r = el.getBoundingClientRect(), ps = ts.panStart;
        setVb(v => ({ ...v, x: ps.vb.x - (e.touches[0].clientX - ps.x) * ps.vb.w / r.width, y: ps.vb.y - (e.touches[0].clientY - ps.y) * ps.vb.h / r.height }));
      }
    };
    el.addEventListener('wheel', onWheel, { passive: false });
    el.addEventListener('touchmove', onTM, { passive: false });
    return () => { el.removeEventListener('wheel', onWheel); el.removeEventListener('touchmove', onTM); };
  }, []);

  /* ── Griglia ── */
  const grid = useMemo(() => {
    const step = Math.pow(10, Math.floor(Math.log10(vb.w / 8)));
    const lines = [];
    for (let x = Math.floor(vb.x / step) * step; x < vb.x + vb.w; x += step) lines.push({ t: 'v', v: x, maj: Math.abs(x % (step * 5)) < step * .01 });
    for (let y = Math.floor(vb.y / step) * step; y < vb.y + vb.h; y += step) lines.push({ t: 'h', v: y, maj: Math.abs(y % (step * 5)) < step * .01 });
    return lines;
  }, [vb]);

  /* ── Modals ── */
  const openEdit = s => { setEditSeg(s); setEditVal(s.dist > 0 ? String(s.dist) : ''); };
  const saveEdit = () => { if (!editSeg) return; const v = parseFloat(editVal.replace(',', '.')); if (!isNaN(v) && v >= 0) setSegs(p => p.map(s => s.id === editSeg.id ? { ...s, dist: v } : s)); setEditSeg(null); };
  const saveAngle = () => {
    if (!editAngle) return; const v = parseFloat(editAngVal.replace(',', '.'));
    if (!isNaN(v) && v > 0 && v < 360) {
      const ex = angles.find(a => a.vertex === editAngle.vertex && ((a.p1 === editAngle.p1 && a.p2 === editAngle.p2) || (a.p1 === editAngle.p2 && a.p2 === editAngle.p1)));
      if (ex) setAngles(p => p.map(a => a.id === ex.id ? { ...a, angle: v } : a));
      else setAngles(p => [...p, { id: Math.random().toString(36).slice(2), ...editAngle, angle: v }]);
    }
    setEditAngle(null);
  };

  /* ── Stats ── */
  const wc = Object.keys(world).length, measd = segs.filter(s => s.dist > 0).length;
  const errs = segs.filter(s => segInfo(s).status === 'error').length;
  const warns = segs.filter(s => segInfo(s).status === 'warn').length;

  /* ── Stile bottoni toolbar ── */
  const TB = { padding: '5px 10px', borderRadius: '4px', cursor: 'pointer', fontSize: '11px', letterSpacing: '1px', border: '1px solid', fontFamily: 'inherit', lineHeight: 1 };
  /* ── Stile bottoni zoom ── */
  const ZB = { width: 40, height: 40, borderRadius: '8px', cursor: 'pointer', fontSize: '18px', border: '1px solid #1a3050', background: '#0c1828', color: '#4a90b8', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'inherit', flexShrink: 0, userSelect: 'none', WebkitUserSelect: 'none' };

  /* ════════════════════════════════════════════════════════════════ */
  return (
    <div style={{ fontFamily: "'JetBrains Mono',monospace", background: C.bg, color: C.tblVal, height: '100dvh', minHeight: '-webkit-fill-available', display: 'flex', flexDirection: 'column', overflow: 'hidden', userSelect: 'none', WebkitUserSelect: 'none' }}>

      {/* ── TOOLBAR ── una sola riga, no wrap ── */}
      <div style={{ background: C.toolbar, borderBottom: `1px solid ${C.border}`, padding: '0 8px', height: 46, display: 'flex', alignItems: 'center', gap: '5px', flexShrink: 0, overflow: 'hidden' }}>
        <span style={{ color: C.tabAct, fontSize: '14px', letterSpacing: '2px', fontWeight: 700, flexShrink: 0 }}>⊕</span>
        <div style={{ flex: 1 }} />
        {/* Mode buttons — solo icona + label corto */}
        {[{ id: 'point', icon: '✦', label: 'PTO' }, { id: 'segment', icon: '—', label: 'SEG' }, { id: 'angle', icon: '∠', label: 'ANG' }, { id: 'pan', icon: '✥', label: 'PAN' }].map(m => (
          <button key={m.id} onClick={() => { setMode(m.id); setSel1(null); setAngSel([]); }}
            style={{ ...TB, minWidth: 0, padding: '4px 8px', background: mode === m.id ? '#60d0ff22' : 'transparent', color: mode === m.id ? C.tabAct : C.tbDim, borderColor: mode === m.id ? '#60d0ff50' : C.border }}>
            {m.icon}<span style={{ fontSize: '9px', marginLeft: 3 }}>{m.label}</span>
          </button>
        ))}
        <div style={{ width: 1, height: 18, background: C.border, flexShrink: 0 }} />
        <button onClick={() => setAdjusted(v => !v)}
          style={{ ...TB, padding: '4px 8px', background: adjusted ? '#60d0ff22' : 'transparent', color: adjusted ? C.tabAct : C.tbDim, borderColor: adjusted ? '#60d0ff50' : C.border }}>
          {adjusted ? '◈' : '◫'}<span style={{ fontSize: '9px', marginLeft: 3 }}>{adjusted ? 'OK' : 'ABB'}</span>
        </button>
        {/* ── BOTTONE DRAWER — sempre visibile in toolbar ── */}
        <button onClick={() => setDrawer(v => !v)}
          style={{ ...TB, padding: '4px 10px', background: drawer ? C.tabAct : 'transparent', color: drawer ? C.bg : C.tbDim, borderColor: drawer ? C.tabAct : C.border, fontSize: 16, lineHeight: 1 }}>
          {drawer ? '✕' : '≡'}
        </button>
        <button onClick={() => { if (window.confirm('Reset?')) { setPts([]); setSegs([]); setAngles([]); } }}
          style={{ ...TB, padding: '4px 8px', background: 'transparent', color: '#ff445580', borderColor: C.border }}>✕</button>
      </div>

      {/* ── BODY: canvas a tutto schermo ── */}
      <div style={{ flex: 1, position: 'relative', overflow: 'hidden' }}>

        {/* ── CANVAS SVG ── */}
        <svg ref={svgRef}
          style={{ width: '100%', height: '100%', display: 'block', background: C.bg, cursor: mode === 'pan' ? (pan ? 'grabbing' : 'grab') : mode === 'point' ? 'crosshair' : 'default', touchAction: 'none' }}
          viewBox={`${vb.x} ${vb.y} ${vb.w} ${vb.h}`}
          onClick={handleClick}
          onMouseDown={onMD} onMouseMove={onMM} onMouseUp={onMU} onMouseLeave={onMU}
          onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>

          {/* Griglia */}
          {grid.map((l, i) => l.t === 'v'
            ? <line key={i} x1={l.v} y1={vb.y} x2={l.v} y2={vb.y + vb.h} stroke={l.maj ? C.gridMaj : C.gridMin} strokeWidth={l.maj ? .6 : .3} />
            : <line key={i} x1={vb.x} y1={l.v} x2={vb.x + vb.w} y2={l.v} stroke={l.maj ? C.gridMaj : C.gridMin} strokeWidth={l.maj ? .6 : .3} />
          )}
          <line x1={vb.x} y1="0" x2={vb.x + vb.w} y2="0" stroke={C.axis} strokeWidth=".8" />
          <line x1="0" y1={vb.y} x2="0" y2={vb.y + vb.h} stroke={C.axis} strokeWidth=".8" />

          {/* Archi angolo */}
          {angles.map(a => {
            const pv = pts.find(p => p.id === a.vertex), p1 = pts.find(p => p.id === a.p1), p2 = pts.find(p => p.id === a.p2); if (!pv || !p1 || !p2) return null;
            const cv = gp(pv), c1 = gp(p1), c2 = gp(p2), arc_r = vb.w / 55;
            const ang1 = Math.atan2(c1.y - cv.y, c1.x - cv.x), ang2 = Math.atan2(c2.y - cv.y, c2.x - cv.x);
            const x1a = cv.x + arc_r * Math.cos(ang1), y1a = cv.y + arc_r * Math.sin(ang1);
            const x2a = cv.x + arc_r * Math.cos(ang2), y2a = cv.y + arc_r * Math.sin(ang2);
            let angDiff = ang2 - ang1; while (angDiff < 0) angDiff += 2 * Math.PI; while (angDiff > 2 * Math.PI) angDiff -= 2 * Math.PI;
            const midAng = angDiff > Math.PI ? (ang1 + ang2) / 2 + Math.PI : (ang1 + ang2) / 2;
            let aCol = C.angCol;
            if (world[a.vertex] && world[a.p1] && world[a.p2]) {
              const wv = world[a.vertex], w1 = world[a.p1], w2 = world[a.p2];
              let calc = Math.atan2(w2.y - wv.y, w2.x - wv.x) - Math.atan2(w1.y - wv.y, w1.x - wv.x);
              while (calc < 0) calc += 2 * Math.PI; while (calc > 2 * Math.PI) calc -= 2 * Math.PI;
              let dA = calc * 180 / Math.PI - a.angle; while (dA > 180) dA -= 360; while (dA < -180) dA += 360;
              aCol = Math.abs(dA) < .1 ? SC.ok : Math.abs(dA) < .5 ? SC.warn : SC.error;
            }
            return <g key={a.id} onClick={e => { e.stopPropagation(); setEditAngle({ ...a }); setEditAngVal(String(a.angle)); }} style={{ cursor: 'pointer' }}>
              <path d={`M ${x1a} ${y1a} A ${arc_r} ${arc_r} 0 ${angDiff > Math.PI ? 1 : 0} 1 ${x2a} ${y2a}`} fill="none" stroke={aCol} strokeWidth={vb.w / 600} opacity=".8" />
              <line x1={cv.x} y1={cv.y} x2={x1a} y2={y1a} stroke={aCol + '30'} strokeWidth={vb.w / 900} />
              <line x1={cv.x} y1={cv.y} x2={x2a} y2={y2a} stroke={aCol + '30'} strokeWidth={vb.w / 900} />
              <text x={cv.x + arc_r * 1.6 * Math.cos(midAng)} y={cv.y + arc_r * 1.6 * Math.sin(midAng)} textAnchor="middle" fill={aCol} fontSize={vb.w / 130} fontFamily="monospace">{a.angle.toFixed(1)}°</text>
            </g>;
          })}

          {/* Segmenti */}
          {segs.map(s => {
            const pa = pts.find(p => p.id === s.p1), pb = pts.find(p => p.id === s.p2); if (!pa || !pb) return null;
            const a = gp(pa), b = gp(pb), { status, calc, delta } = segInfo(s);
            const col = SC[status], mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
            const sw = vb.w / 500, isH = hov === s.id, fs = vb.w / 100, bw = fs * 7.5, bh = fs * 1.7;
            return <g key={s.id} onClick={e => { e.stopPropagation(); openEdit(s); }} onMouseEnter={() => setHov(s.id)} onMouseLeave={() => setHov(null)} style={{ cursor: 'pointer' }}>
              <line x1={a.x} y1={a.y} x2={b.x} y2={b.y} stroke="transparent" strokeWidth={sw * 16} />
              <line x1={a.x} y1={a.y} x2={b.x} y2={b.y} stroke={col} strokeWidth={isH ? sw * 3.5 : sw * 2}
                strokeDasharray={status === 'unmeasured' ? `${sw * 8} ${sw * 4}` : undefined} opacity={isH ? 1 : .9} />
              {status === 'error' && <line x1={a.x} y1={a.y} x2={b.x} y2={b.y} stroke={col} strokeWidth={sw * 8} opacity=".12" />}
              {(s.dist > 0 || isH) && <>
                <rect x={mx - bw / 2} y={my - bh / 2 - 1} width={bw} height={bh + 2} fill={C.bg} fillOpacity=".96" rx="2" stroke={col} strokeWidth={sw * .6} strokeOpacity=".4"/>
                <text x={mx} y={my + bh / 2 - 2} textAnchor="middle" fill={col} fontSize={fs} fontFamily="monospace" fontWeight="bold">
                  {s.dist > 0 ? `${s.dist.toFixed(2)}m` : '± mis.'}
                  {delta != null && ` Δ${delta >= 0 ? '+' : ''}${(delta * 100).toFixed(0)}cm`}
                </text>
              </>}
            </g>;
          })}

          {/* Punti */}
          {pts.map((p, pi) => {
            const pp = gp(p), isSel = sel1 === p.id || angSel.includes(p.id), isFixed = pi < 2, r = vb.w / 90, w = world[p.id], sig = sigma[p.id];
            const ptColor = isFixed ? C.ptFixed : C.ptFree;
            return <g key={p.id}>
              {isSel && <circle cx={pp.x} cy={pp.y} r={r * 2.8} fill="none" stroke={ptColor} strokeWidth={r * .3} opacity=".5"><animate attributeName="r" values={`${r * 2};${r * 3.5};${r * 2}`} dur="1.1s" repeatCount="indefinite" /></circle>}
              {/* Alone scuro per contrasto sul bianco */}
              <circle cx={pp.x} cy={pp.y} r={r * 1.6} fill={C.bg} fillOpacity=".7" />
              <circle cx={pp.x} cy={pp.y} r={r} fill={isSel ? ptColor : C.ptFill} stroke={ptColor} strokeWidth={r * .55} />
              {/* Etichetta con alone */}
              <text x={pp.x} y={pp.y - r * 2.2} textAnchor="middle"
                stroke={C.bg} strokeWidth={r * 1.2} strokeOpacity=".9" paintOrder="stroke"
                fill={ptColor} fontSize={r * 2.4} fontFamily="monospace" fontWeight="bold">{p.label}</text>
              {w && <text x={pp.x} y={pp.y + r * 3.8} textAnchor="middle"
                stroke={C.bg} strokeWidth={r * .8} strokeOpacity=".9" paintOrder="stroke"
                fill={C.ptCoord} fontSize={r * 1.2} fontFamily="monospace">
                {w.x.toFixed(2)},{w.y.toFixed(2)}
              </text>}
              {sig && (sig.sx > 0 || sig.sy > 0) && <text x={pp.x} y={pp.y + r * 5.4} textAnchor="middle"
                stroke={C.bg} strokeWidth={r * .7} strokeOpacity=".9" paintOrder="stroke"
                fill={C.tbDim} fontSize={r * 1.05} fontFamily="monospace">σ±{Math.max(sig.sx, sig.sy).toFixed(0)}mm</text>}
            </g>;
          })}

          {/* Selezione angolo */}
          {mode === 'angle' && angSel.map(id => pts.find(p => p.id === id)).filter(Boolean).map(p => {
            const pp = gp(p), r = vb.w / 75; return <circle key={p.id} cx={pp.x} cy={pp.y} r={r} fill={C.angCol + '22'} stroke={C.angCol} strokeWidth={r * .25} />;
          })}
        </svg>

        {/* ── CONTROLLI ZOOM (bottom-left) ── */}
        <div style={{ position: 'absolute', bottom: 16, left: 16, display: 'flex', flexDirection: 'column', gap: 6 }}>
          <button style={{ ...ZB, background: '#0d1520', border: `1px solid ${C.border}`, color: '#c0e0ff' }} onClick={() => zoomBy(0.7)} title="Zoom +">＋</button>
          <button style={{ ...ZB, background: '#0d1520', border: `1px solid ${C.border}`, color: '#c0e0ff', fontSize: 13 }} onClick={fitContent} title="Adatta">⊡ fit</button>
          <button style={{ ...ZB, background: '#0d1520', border: `1px solid ${C.border}`, color: '#c0e0ff' }} onClick={() => zoomBy(1.43)} title="Zoom −">－</button>
        </div>

        {/* ── HINT MODO (top-center) ── */}
        <div style={{ position: 'absolute', top: 10, left: '50%', transform: 'translateX(-50%)', background: '#0d152088', border: `1px solid ${C.border}`, borderRadius: '4px', padding: '4px 16px', fontSize: '10px', color: C.tabAct, pointerEvents: 'none', letterSpacing: '1px', whiteSpace: 'nowrap', fontWeight: 'bold' }}>
          {mode === 'point' && '✦ TOCCA PER PUNTO'}
          {mode === 'segment' && (sel1 ? '→ SCEGLI 2° PUNTO' : '✦ SCEGLI 1° PUNTO')}
          {mode === 'angle' && ['∠ LATO 1', '∠ VERTICE', '∠ LATO 2'][angSel.length]}
          {mode === 'pan' && '✥ TRASCINA · PIZZICA ZOOM'}
        </div>

        {/* ── STATUS BAR (bottom, sopra zoom) ── */}
        <div style={{ position: 'absolute', bottom: 16, left: '50%', transform: 'translateX(-50%)', background: '#0d1520dd', border: `1px solid ${C.border}`, borderRadius: '20px', padding: '5px 14px', display: 'flex', gap: 10, fontSize: '10px', letterSpacing: '1px', whiteSpace: 'nowrap' }}>
          {[
            { l: 'P', v: pts.length, c: C.tblVal }, { l: 'S', v: segs.length, c: C.tblVal },
            { l: 'M', v: `${measd}/${segs.length}`, c: C.ptFree },
            errs > 0 && { l: '✗', v: errs, c: SC.error },
            warns > 0 && { l: '!', v: warns, c: SC.warn },
            wc > 0 && { l: '✓', v: wc, c: SC.ok },
            redundancy > 0 && sigma0 != null && { l: 'LS', v: `σ₀${(sigma0 * 1000).toFixed(1)}`, c: C.lsGreen },
          ].filter(Boolean).map((item, i) => (
            <span key={i}><span style={{ color: C.tbDim }}>{item.l} </span><span style={{ color: item.c, fontWeight: 'bold' }}>{item.v}</span></span>
          ))}
        </div>

        {/* ── BACKDROP drawer ── */}
        {drawer && <div style={{ position: 'absolute', inset: 0, background: '#00000040' }} onClick={() => setDrawer(false)} />}

        {/* ════════════════════════════════════════════════════════
             DRAWER — pannello dati scorrevole
        ════════════════════════════════════════════════════════ */}
        <div style={{
          position: 'absolute', top: 0, right: 0, bottom: 0,
          width: 'min(290px, 92vw)',
          background: C.drawerBg,
          borderLeft: `1px solid ${C.border}`,
          display: 'flex', flexDirection: 'column',
          transform: drawer ? 'translateX(0)' : 'translateX(100%)',
          transition: 'transform .28s cubic-bezier(.4,0,.2,1)',
          boxShadow: drawer ? '-8px 0 32px #00000060' : 'none',
          zIndex: 10,
        }}>
          {/* Header drawer */}
          <div style={{ padding: '10px 12px 8px', borderBottom: `1px solid ${C.border}`, display: 'flex', alignItems: 'center', gap: 8, flexShrink: 0 }}>
            <span style={{ color: C.tabAct, fontSize: '11px', letterSpacing: '2px', flex: 1, fontWeight: 'bold' }}>DATI RILIEVO</span>
            <button onClick={() => setDrawer(false)} style={{ background: 'none', border: 'none', color: C.tbDim, cursor: 'pointer', fontSize: 18, padding: '2px 6px', fontFamily: 'inherit' }}>✕</button>
          </div>

          {/* Tab bar drawer */}
          <div style={{ display: 'flex', borderBottom: `1px solid ${C.border}`, flexShrink: 0 }}>
            {[{ id: 'pts', l: 'PUNTI' }, { id: 'segs', l: 'SEG.' }, { id: 'ang', l: 'ANG.' }, { id: 'exp', l: 'EXPORT' }].map(t => (
              <button key={t.id} onClick={() => setTab(t.id)} style={{ flex: 1, padding: '9px 2px', background: tab === t.id ? '#141e2c' : 'transparent', color: tab === t.id ? C.tabAct : C.tabInact, border: 'none', borderBottom: `2px solid ${tab === t.id ? C.tabAct : 'transparent'}`, cursor: 'pointer', fontSize: '9px', letterSpacing: '1px', fontFamily: 'inherit', fontWeight: tab === t.id ? 'bold' : 'normal' }}>
                {t.l}
              </button>
            ))}
          </div>

          {/* Contenuto tab */}
          <div style={{ flex: 1, overflow: 'auto', padding: '10px', WebkitOverflowScrolling: 'touch' }}>

            {/* TAB PUNTI */}
            {tab === 'pts' && (
              <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '11px' }}>
                <thead><tr style={{ color: C.tblHdr, borderBottom: `1px solid ${C.border}` }}>
                  {['Pt', 'X (m)', 'Y (m)', 'σ mm', ''].map((h, i) => <th key={i} style={{ padding: '5px 3px', textAlign: i === 0 ? 'left' : 'right', fontSize: '10px' }}>{h}</th>)}
                </tr></thead>
                <tbody>
                  {pts.map((p, pi) => {
                    const w = world[p.id], sig = sigma[p.id];
                    return <tr key={p.id} style={{ borderBottom: `1px solid ${C.gridMin}` }}>
                      <td style={{ padding: '5px 3px', color: pi < 2 ? C.ptFixed : C.ptFree, fontWeight: 'bold', fontSize: '12px' }}>{p.label}{pi < 2 ? '*' : ''}</td>
                      <td style={{ padding: '5px 3px', textAlign: 'right', color: w ? C.tblVal : C.tblDim, fontSize: '11px' }}>{w ? w.x.toFixed(3) : '—'}</td>
                      <td style={{ padding: '5px 3px', textAlign: 'right', color: w ? C.tblVal : C.tblDim, fontSize: '11px' }}>{w ? w.y.toFixed(3) : '—'}</td>
                      <td style={{ padding: '5px 3px', textAlign: 'right', color: sig && (sig.sx > 0 || sig.sy > 0) ? C.lsGreen : C.tblDim, fontSize: '11px' }}>{sig ? (sig.sx === 0 && sig.sy === 0 ? 'fisso' : `±${Math.max(sig.sx, sig.sy).toFixed(0)}`) : '—'}</td>
                      <td style={{ padding: '5px 3px', textAlign: 'center' }}>
                        <button onClick={() => {
                          const id = p.id;
                          setPts(prev => prev.filter(x => x.id !== id));
                          setSegs(prev => prev.filter(x => x.p1 !== id && x.p2 !== id));
                          setAngles(prev => prev.filter(x => x.vertex !== id && x.p1 !== id && x.p2 !== id));
                        }} style={{ background: 'none', border: 'none', color: '#ff4455', cursor: 'pointer', fontSize: 18, fontFamily: 'inherit', padding: '0 6px' }}>✕</button>
                      </td>
                    </tr>;
                  })}
                </tbody>
                <tfoot><tr><td colSpan={5} style={{ padding: '5px 3px', color: '#203040', fontSize: '9px' }}>* punti fissi (datum A,B)</td></tr></tfoot>
              </table>
            )}

            {/* TAB SEGMENTI */}
            {tab === 'segs' && (<>
              <div style={{ color: C.tblDim, fontSize: '9px', marginBottom: 8 }}>Tocca segmento per misurare</div>
              <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '11px' }}>
                <thead><tr style={{ color: C.tblHdr, borderBottom: `1px solid ${C.border}` }}>
                  {['Seg', 'Mis.', 'Cal.', 'Δcm', ''].map((h, i) => <th key={i} style={{ padding: '5px 3px', textAlign: i === 0 ? 'left' : 'right' }}>{h}</th>)}
                </tr></thead>
                <tbody>
                  {segs.map(s => {
                    const pa = pts.find(p => p.id === s.p1), pb = pts.find(p => p.id === s.p2);
                    const { status, calc, delta } = segInfo(s); const col = SC[status];
                    return <tr key={s.id} onClick={() => openEdit(s)} onMouseEnter={() => setHov(s.id)} onMouseLeave={() => setHov(null)}
                      style={{ borderBottom: `1px solid ${C.gridMin}`, cursor: 'pointer', background: hov === s.id ? C.rowHov : 'transparent' }}>
                      <td style={{ padding: '5px 3px' }}><span style={{ color: col, marginRight: 4, fontSize: 13 }}>●</span><span style={{ color: C.tblVal, fontWeight: 'bold' }}>{pa?.label || '?'}{pb?.label || '?'}</span></td>
                      <td style={{ padding: '5px 3px', textAlign: 'right', color: s.dist > 0 ? C.tblVal : C.tblDim }}>{s.dist > 0 ? s.dist.toFixed(3) : '—'}</td>
                      <td style={{ padding: '5px 3px', textAlign: 'right', color: C.lsGreen }}>{calc != null ? calc.toFixed(3) : '—'}</td>
                      <td style={{ padding: '5px 3px', textAlign: 'right', color: col, fontWeight: delta != null && Math.abs(delta) > TOL_WARN ? 'bold' : 'normal' }}>
                        {delta != null ? `${delta >= 0 ? '+' : ''}${(delta * 100).toFixed(0)}` : '—'}
                      </td>
                      <td style={{ padding: '5px 3px', textAlign: 'center' }}>
                        <button onClick={e => { e.stopPropagation(); const id = s.id; setSegs(prev => prev.filter(x => x.id !== id)); }} style={{ background: 'none', border: 'none', color: '#ff4455', cursor: 'pointer', fontSize: 18, fontFamily: 'inherit', padding: '0 6px' }}>✕</button>
                      </td>
                    </tr>;
                  })}
                </tbody>
              </table>
              {redundancy > 0 && sigma0 != null && <div style={{ marginTop: 10, padding: 8, background: '#0a1820', borderRadius: 4, border: `1px solid ${C.border}`, fontSize: '10px', color: C.lsGreen, lineHeight: 1.7 }}>
                <b style={{ color: C.lsGreen }}>COMPENSAZIONE LS</b><br />r={redundancy} · σ₀={(sigma0 * 1000).toFixed(2)}mm<br />
                <span style={{ color: redundancy >= 3 ? SC.ok : SC.warn }}>{redundancy >= 6 ? '✓ Rete ben cond.' : redundancy >= 3 ? '~ Ridondanza ok' : '⚠ Ridondanza bassa'}</span>
              </div>}
              <div style={{ marginTop: 10, display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                {[['ok', '<1cm'], ['warn', '1-5cm'], ['error', '>5cm'], ['unmeasured', 'N/mis']].map(([k, l]) => (
                  <span key={k} style={{ fontSize: '10px', color: C.tblHdr, display: 'flex', alignItems: 'center', gap: 4 }}><span style={{ color: SC[k], fontSize: 14 }}>●</span>{l}</span>
                ))}
              </div>
              {/* Chiusura triangoli */}
              {pts.length >= 3 && segs.length >= 3 && (() => {
                const tris = [];
                for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) for (let k = j + 1; k < pts.length; k++) {
                  const [A, B, C] = [pts[i], pts[j], pts[k]];
                  const ab = segs.find(s => (s.p1 === A.id && s.p2 === B.id) || (s.p1 === B.id && s.p2 === A.id));
                  const bc = segs.find(s => (s.p1 === B.id && s.p2 === C.id) || (s.p1 === C.id && s.p2 === B.id));
                  const ac = segs.find(s => (s.p1 === A.id && s.p2 === C.id) || (s.p1 === C.id && s.p2 === A.id));
                  if (ab?.dist > 0 && bc?.dist > 0 && ac?.dist > 0) {
                    const [a, b, c] = [ab.dist, bc.dist, ac.dist]; const ok = a + b > c && a + c > b && b + c > a;
                    tris.push({ lbl: `${A.label}${B.label}${C.label}`, ok, area: ok ? Math.sqrt(Math.max(0, (a + b + c) * (-a + b + c) * (a - b + c) * (a + b - c))) / 4 : 0 });
                  }
                }
                if (!tris.length) return null;
                return <div style={{ marginTop: 10, borderTop: '1px solid #182840', paddingTop: 8 }}>
                  <div style={{ color: '#2a4868', fontSize: '9px', letterSpacing: '1px', marginBottom: 6 }}>CHIUSURA △</div>
                  {tris.map(t => <div key={t.lbl} style={{ fontSize: '10px', color: t.ok ? '#00b86a' : '#d83040', marginBottom: 3, display: 'flex', gap: 6 }}>
                    <span>{t.ok ? '✓' : '✗'} △{t.lbl}</span>
                    {t.ok && <span style={{ color: '#306858' }}>A={t.area.toFixed(2)}m²</span>}
                    {!t.ok && <span>disug. triang.</span>}
                  </div>)}
                </div>;
              })()}
            </>)}

            {/* TAB ANGOLI */}
            {tab === 'ang' && (<>
              <div style={{ color: '#2a4868', fontSize: '9px', marginBottom: 8, lineHeight: 1.6 }}>Usa ∠ ANG: tocca P1→Vertice→P2</div>
              {angles.length === 0 && <div style={{ color: '#203040', fontSize: '10px', padding: '16px 0', textAlign: 'center' }}>Nessun vincolo angolare</div>}
              {angles.length > 0 && <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '11px' }}>
                <thead><tr style={{ color: '#2a4868', borderBottom: '1px solid #182840' }}>
                  <th style={{ padding: '5px 3px', textAlign: 'left' }}>Ang.</th>
                  <th style={{ padding: '5px 3px', textAlign: 'right' }}>Mis.°</th>
                  <th style={{ padding: '5px 3px', textAlign: 'right' }}>Cal.°</th>
                  <th style={{ padding: '5px 3px', textAlign: 'right' }}>Δ°</th>
                  <th></th>
                </tr></thead>
                <tbody>
                  {angles.map(a => {
                    const pv = pts.find(p => p.id === a.vertex), p1 = pts.find(p => p.id === a.p1), p2 = pts.find(p => p.id === a.p2);
                    const wv = world[a.vertex], w1 = world[a.p1], w2 = world[a.p2];
                    let calcAng = null, deltaAng = null;
                    if (wv && w1 && w2) { let ag = Math.atan2(w2.y - wv.y, w2.x - wv.x) - Math.atan2(w1.y - wv.y, w1.x - wv.x); while (ag < 0) ag += 2 * Math.PI; while (ag > 2 * Math.PI) ag -= 2 * Math.PI; calcAng = ag * 180 / Math.PI; deltaAng = calcAng - a.angle; while (deltaAng > 180) deltaAng -= 360; while (deltaAng < -180) deltaAng += 360; }
                    const col = deltaAng == null ? C.tblDim : Math.abs(deltaAng) < .1 ? SC.ok : Math.abs(deltaAng) < .5 ? SC.warn : SC.error;
                    return <tr key={a.id} onClick={() => { setEditAngle({ ...a }); setEditAngVal(String(a.angle)); }} style={{ borderBottom: `1px solid ${C.gridMin}`, cursor: 'pointer' }}>
                      <td style={{ padding: '5px 3px' }}><span style={{ color: col, marginRight: 4 }}>∠</span><span style={{ color: C.tblVal, fontWeight: 'bold' }}>{p1?.label}{pv?.label}{p2?.label}</span></td>
                      <td style={{ padding: '5px 3px', textAlign: 'right', color: C.tblVal }}>{a.angle.toFixed(1)}</td>
                      <td style={{ padding: '5px 3px', textAlign: 'right', color: C.lsGreen }}>{calcAng != null ? calcAng.toFixed(1) : '—'}</td>
                      <td style={{ padding: '5px 3px', textAlign: 'right', color: col, fontWeight: 'bold' }}>{deltaAng != null ? `${deltaAng >= 0 ? '+' : ''}${deltaAng.toFixed(1)}` : '—'}</td>
                      <td style={{ padding: '5px 3px', textAlign: 'center' }}>
                        <button onClick={e => { e.stopPropagation(); const id = a.id; setAngles(prev => prev.filter(x => x.id !== id)); }} style={{ background: 'none', border: 'none', color: '#ff4455', cursor: 'pointer', fontSize: 18, fontFamily: 'inherit', padding: '0 6px' }}>✕</button>
                      </td>
                    </tr>;
                  })}
                </tbody>
              </table>}
            </>)}

            {/* TAB EXPORT */}
            {tab === 'exp' && (<div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              <div style={{ color: '#2a4868', fontSize: '9px', marginBottom: 2 }}>{wc} coord · {measd} mis · {angles.length} ang</div>
              {[
                { label: 'Esporta DXF', sub: 'AutoCAD / LibreCAD', col: '#3a78c0', action: () => dl(makeDXF(pts, segs, world), 'rilievo.dxf', 'application/dxf') },
                {
                  label: 'Esporta CSV', sub: 'Coordinate + σ + residui', col: '#00b86a', action: () => {
                    const rows = ['Punto,X(m),Y(m),sx(mm),sy(mm)'];
                    pts.forEach(p => { const w = world[p.id], sig = sigma[p.id]; rows.push(`${p.label},${w ? w.x.toFixed(4) : ''},${w ? w.y.toFixed(4) : ''},${sig ? sig.sx.toFixed(1) : ''},${sig ? sig.sy.toFixed(1) : ''}`); });
                    rows.push('', 'Segmento,Da,A,Misurato(m),Calcolato(m),Residuo(cm)');
                    segs.forEach(s => { const pa = pts.find(p => p.id === s.p1), pb = pts.find(p => p.id === s.p2); const { calc, delta } = segInfo(s); rows.push(`${pa?.label}-${pb?.label},${pa?.label},${pb?.label},${s.dist || ''},${calc ? calc.toFixed(4) : ''},${delta != null ? (delta * 100).toFixed(1) : ''}`); });
                    dl(rows.join('\n'), 'rilievo.csv', 'text/csv');
                  }
                },
                { label: 'Salva JSON', sub: 'Progetto completo', col: '#e09020', action: () => dl(JSON.stringify({ pts, segs, angles }, null, 2), 'rilievo.json') },
              ].map(b => (
                <button key={b.label} onClick={b.action} style={{ padding: '12px 14px', background: b.col + '12', border: `1px solid ${b.col}25`, borderRadius: 6, color: b.col, cursor: 'pointer', textAlign: 'left', width: '100%', fontFamily: 'inherit' }}>
                  <div style={{ fontWeight: 'bold', fontSize: '11px', letterSpacing: '1px' }}>{b.label}</div>
                  <div style={{ color: '#2a4868', fontSize: '9px', marginTop: 3 }}>{b.sub}</div>
                </button>
              ))}
              <label style={{ padding: '12px 14px', background: '#ffffff08', border: '1px solid #182840', borderRadius: 6, color: '#3a6080', cursor: 'pointer', display: 'block' }}>
                <div style={{ fontWeight: 'bold', fontSize: '11px', letterSpacing: '1px' }}>Carica JSON</div>
                <div style={{ color: '#2a4868', fontSize: '9px', marginTop: 3 }}>Ripristina progetto</div>
                <input type="file" accept=".json" onChange={e => { const f = e.target.files?.[0]; if (!f) return; const r = new FileReader(); r.onload = ev => { try { const d = JSON.parse(ev.target.result); if (d.pts) setPts(d.pts); if (d.segs) setSegs(d.segs); if (d.angles) setAngles(d.angles); } catch (_) { alert('File non valido'); } }; r.readAsText(f); e.target.value = ''; }} style={{ display: 'none' }} />
              </label>
              <div style={{ borderTop: '1px solid #182840', paddingTop: 8, fontSize: '9px', color: '#2a4868', lineHeight: 1.8 }}>
                A* = Origine · B* = Asse X<br />
                LS iterativo · σ in mm
              </div>
            </div>)}
          </div>
        </div>
      </div>

      {/* ── MODAL: misura segmento ── */}
      {editSeg && (() => {
        const pa = pts.find(p => p.id === editSeg.p1), pb = pts.find(p => p.id === editSeg.p2);
        const { status, calc, delta } = segInfo(editSeg);
        return <div style={{ position: 'fixed', inset: 0, background: '#000000b0', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 200, padding: 20 }} onClick={() => setEditSeg(null)}>
          <div style={{ background: '#0d1520', border: `1px solid ${C.border}`, borderRadius: 10, padding: '22px 24px', width: '100%', maxWidth: 300, boxShadow: '0 0 40px #00000080' }} onClick={e => e.stopPropagation()}>
            <div style={{ color: C.tblDim, fontSize: '9px', letterSpacing: '2px', marginBottom: 6 }}>MISURA SEGMENTO</div>
            <div style={{ color: C.ptFree, fontSize: '28px', fontWeight: 700, marginBottom: 12, letterSpacing: '3px' }}>{pa?.label} — {pb?.label}</div>
            {calc != null && <div style={{ color: SC[status], fontSize: '12px', marginBottom: 12, fontWeight: 'bold' }}>Calc: {calc.toFixed(3)}m {delta != null && <span>· Δ {delta >= 0 ? '+' : ''}{(delta * 100).toFixed(1)}cm</span>}</div>}
            <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
              <input autoFocus type="number" step="0.001" min="0" value={editVal} onChange={e => setEditVal(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') saveEdit(); if (e.key === 'Escape') setEditSeg(null); }} placeholder="es. 3.450"
                style={{ flex: 1, background: '#111e30', border: `2px solid ${C.border}`, borderRadius: 6, color: '#ffffff', padding: '12px 14px', fontSize: '24px', fontFamily: 'monospace', outline: 'none', WebkitAppearance: 'none' }} />
              <span style={{ color: C.tblVal, fontSize: 18, fontWeight: 'bold' }}>m</span>
            </div>
            <div style={{ display: 'flex', gap: 8, marginTop: 14 }}>
              <button onClick={saveEdit} style={{ flex: 1, padding: 14, background: '#60d0ff22', border: `2px solid ${C.ptFree}`, color: C.ptFree, borderRadius: 6, cursor: 'pointer', fontSize: '13px', letterSpacing: '1px', fontFamily: 'inherit', fontWeight: 'bold' }}>✓ CONFERMA</button>
              <button onClick={() => setEditSeg(null)} style={{ padding: '14px 18px', background: 'transparent', border: `1px solid ${C.border}`, color: C.tblDim, borderRadius: 6, cursor: 'pointer', fontFamily: 'inherit', fontSize: 16 }}>✕</button>
            </div>
          </div>
        </div>;
      })()}

      {/* ── MODAL: vincolo angolare ── */}
      {editAngle && (() => {
        const pv = pts.find(p => p.id === editAngle.vertex), p1 = pts.find(p => p.id === editAngle.p1), p2 = pts.find(p => p.id === editAngle.p2);
        return <div style={{ position: 'fixed', inset: 0, background: '#000000b0', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 200, padding: 20 }} onClick={() => setEditAngle(null)}>
          <div style={{ background: '#0d1520', border: `1px solid ${C.border}`, borderRadius: 10, padding: '22px 24px', width: '100%', maxWidth: 300 }} onClick={e => e.stopPropagation()}>
            <div style={{ color: C.tblDim, fontSize: '9px', letterSpacing: '2px', marginBottom: 6 }}>VINCOLO ANGOLARE</div>
            <div style={{ color: C.angCol, fontSize: '22px', fontWeight: 700, marginBottom: 8 }}>∠ {p1?.label}–{pv?.label}–{p2?.label}</div>
            <div style={{ color: C.tblHdr, fontSize: '11px', marginBottom: 14 }}>Angolo in {pv?.label} tra {p1?.label} e {p2?.label}</div>
            <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
              <input autoFocus type="number" step="0.01" min="0.01" max="359.99" value={editAngVal} onChange={e => setEditAngVal(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') saveAngle(); if (e.key === 'Escape') setEditAngle(null); }} placeholder="es. 90.00"
                style={{ flex: 1, background: '#111e30', border: `2px solid ${C.border}`, borderRadius: 6, color: '#ffffff', padding: '12px 14px', fontSize: '24px', fontFamily: 'monospace', outline: 'none', WebkitAppearance: 'none' }} />
              <span style={{ color: C.tblVal, fontSize: 18, fontWeight: 'bold' }}>°</span>
            </div>
            <div style={{ display: 'flex', gap: 8, marginTop: 14 }}>
              <button onClick={saveAngle} style={{ flex: 1, padding: 14, background: C.angCol + '22', border: `2px solid ${C.angCol}`, color: C.angCol, borderRadius: 6, cursor: 'pointer', fontSize: '13px', letterSpacing: '1px', fontFamily: 'inherit', fontWeight: 'bold' }}>✓ CONFERMA</button>
              <button onClick={() => setEditAngle(null)} style={{ padding: '14px 18px', background: 'transparent', border: `1px solid ${C.border}`, color: C.tblDim, borderRadius: 6, cursor: 'pointer', fontFamily: 'inherit', fontSize: 16 }}>✕</button>
            </div>
          </div>
        </div>;
      })()}
    </div>
  );
}

    ReactDOM.createRoot(document.getElementById('root')).render(<Rilievo />);
  </script>
</body>
</html>
